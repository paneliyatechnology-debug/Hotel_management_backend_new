<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GST report {{PERIOD}}</title>
  <style>
    /*{{FONT_FACE}}*/

    :root { --bw: 0.5px; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    @page { size: A4 landscape; margin: 0; }
    .sheet {
      padding: 8mm 8mm 16mm 8mm;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    html, body { width: 297mm; background: #ffffff; }
    body {
      font-family: "Segoe UI", Arial, "Helvetica Neue", sans-serif;
      font-size: 8px;
      line-height: 1.3;
      color: #000000;
      font-variant-numeric: tabular-nums;
    }

    .head { border: var(--bw) solid #000; padding: 6px 10px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 16px; }
    .head h1 { font-size: 14px; font-weight: 700; }
    .head .muted { font-size: 8px; color: #333; margin-top: 2px; }
    .head .tax { font-size: 8px; color: #000; margin-top: 3px; font-weight: 500; }
    .head .tax .sep { margin: 0 8px; color: #555; }
    .head .right { text-align: right; }
    .title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin: 0 0 4px 0; }

    /* Hairline grid (same trick as the bill: layout zoom + PDF scale → thin lines, not bold). */
    table { width: 100%; border-collapse: collapse; border: var(--bw) solid #000; }
    th, td { border: var(--bw) solid #000; padding: 2px 3px; vertical-align: top; background: #ffffff; font-weight: 400; }
    th { font-weight: 600; text-align: left; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    thead { display: table-header-group; }
    tfoot { display: table-row-group; }
    tr, th, td { break-inside: avoid; page-break-inside: avoid; }
    tr.total td { font-weight: 600; }
    .cancelled td { text-decoration: line-through; }
    .foot {
      position: fixed;
      left: 8mm;
      right: 8mm;
      bottom: 4mm;
      background: #ffffff;
      font-size: 8px;
      text-align: center;
      border-top: var(--bw) solid #000;
      padding-top: 3px;
    }
    .page-break { break-before: page; page-break-before: always; height: 0; }
  </style>
</head>
<body>
<div class="sheet">
  <div class="head">
    <div>
      <h1>{{HOTEL_NAME}}</h1>
      <div class="muted">{{HOTEL_ADDRESS}}</div>
      <div class="tax">{{HOTEL_TAX_LINE}}</div>
    </div>
    <div class="right">
      <h1>GST Report</h1>
      <div class="muted">Period: {{PERIOD}}</div>
      <div class="muted">Filters: {{FILTERS}}</div>
      <div class="muted">Generated: {{GENERATED_AT}}</div>
    </div>
  </div>

  <div class="title">Invoice-wise detail</div>
  {{ROWS_TABLE}}
</div>
<div class="foot">&copy; {{YEAR}} <strong>{{HOTEL_NAME}}</strong>. Powered by MYOWNPMS.</div>
<script>
  /* Chrome will not draw a border thinner than 1 layout pixel. Print at PDF_SCALE while
     laying out at 1/PDF_SCALE zoom so table lines stay hairline (not bold) in the PDF.
     Each page still gets its own finished table; a page never opens with only the total row. */
  var PDF_SCALE = 0.5;
  window.pdfScale = PDF_SCALE;
  window.fitToPage = function () {
    var body = document.body;
    var z = 1;
    var zoomFactor = z / PDF_SCALE;
    body.style.zoom = zoomFactor;
    body.style.setProperty('--bw', (PDF_SCALE / z) + 'px');
    body.style.width = (297 / z) + 'mm';

    var sheet = document.querySelector('.sheet');
    var table = sheet && sheet.querySelector('table');
    if (!sheet || !table || table.getAttribute('data-paged') === '1') return;

    var thead = table.querySelector('thead');
    var tbody = table.querySelector('tbody');
    var tfoot = table.querySelector('tfoot');
    if (!thead || !tbody) return;

    var mm = 96 / 25.4;
    var padTop = parseFloat(window.getComputedStyle(sheet).paddingTop) || (8 * mm);
    var padBottom = parseFloat(window.getComputedStyle(sheet).paddingBottom) || (16 * mm);
    // getBoundingClientRect is zoomed; computed padding is not — scale both sides the same way.
    var contentH = ((210 * mm) - padTop - padBottom) * zoomFactor;
    var rows = Array.prototype.slice.call(tbody.rows);
    if (!rows.length) return;

    var theadH = thead.getBoundingClientRect().height;
    var rowH = rows.map(function (row) { return row.getBoundingClientRect().height; });
    var totalH = tfoot ? tfoot.getBoundingClientRect().height : 0;
    var tableTop = table.getBoundingClientRect().top - sheet.getBoundingClientRect().top - (padTop * zoomFactor);
    if (tableTop < 0) tableTop = 0;

    var space = contentH - tableTop;
    var pages = [];
    var index = 0;
    while (index < rows.length) {
      var count = 0;
      var used = theadH;
      while (index + count < rows.length) {
        var last = index + count === rows.length - 1;
        var nextUsed = used + rowH[index + count] + (last ? totalH : 0);
        if (count > 0 && nextUsed > space + 0.5) break;
        used += rowH[index + count];
        count += 1;
      }
      if (count < 1) count = 1;
      pages.push([index, index + count]);
      index += count;
      space = contentH;
    }

    if (pages.length < 2) return;

    var previous = pages[pages.length - 2];
    var lastPage = pages[pages.length - 1];
    var lastCount = lastPage[1] - lastPage[0];
    while (lastCount < 4 && previous[1] - previous[0] > 1) {
      previous[1] -= 1;
      lastPage[0] -= 1;
      lastCount += 1;
    }

    var parent = table.parentNode;
    var marker = table.nextSibling;
    table.setAttribute('data-paged', '1');
    for (var pageIndex = 1; pageIndex < pages.length; pageIndex += 1) {
      var slice = pages[pageIndex];
      var breaker = document.createElement('div');
      breaker.className = 'page-break';
      var nextTable = document.createElement('table');
      nextTable.setAttribute('data-paged', '1');
      nextTable.appendChild(thead.cloneNode(true));
      var nextBody = document.createElement('tbody');
      rows.slice(slice[0], slice[1]).forEach(function (row) { nextBody.appendChild(row); });
      nextTable.appendChild(nextBody);
      if (pageIndex === pages.length - 1 && tfoot) nextTable.appendChild(tfoot);
      parent.insertBefore(breaker, marker);
      parent.insertBefore(nextTable, marker);
    }
  };
</script>
</body>
</html>
