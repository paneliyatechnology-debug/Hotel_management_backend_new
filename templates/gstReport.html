<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GST report {{PERIOD}}</title>
  <style>
    /*{{FONT_FACE}}*/

    * { box-sizing: border-box; margin: 0; padding: 0; }
    @page { size: A4 landscape; margin: 0; }
    .sheet { padding: 10mm 8mm 14mm 8mm; }
    html, body { background: #ffffff; }
    body {
      font-family: "Segoe UI", Arial, "Helvetica Neue", sans-serif;
      font-size: 8px;
      line-height: 1.3;
      color: #000000;
      font-variant-numeric: tabular-nums;
    }

    .head { border: 1px solid #000; padding: 6px 10px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 16px; }
    .head h1 { font-size: 14px; font-weight: 700; }
    .head .muted { font-size: 8px; color: #333; margin-top: 2px; }
    .head .right { text-align: right; }
    .title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin: 0 0 4px 0; }

    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #000; padding: 2px 3px; vertical-align: top; }
    th { font-weight: 700; text-align: left; background: #ffffff; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    thead { display: table-header-group; }
    tr.total td { font-weight: 700; }
    .cancelled td { text-decoration: line-through; }
    .foot {
      position: fixed;
      left: 8mm;
      right: 8mm;
      bottom: 4mm;
      background: #ffffff;
      font-size: 8px;
      text-align: center;
      border-top: 1px solid #000;
      padding-top: 3px;
    }
  </style>
</head>
<body>
<div class="sheet">
  <div class="head">
    <div>
      <h1>{{HOTEL_NAME}}</h1>
      <div class="muted">{{HOTEL_ADDRESS}}</div>
      <div class="muted">{{HOTEL_TAX_LINE}}</div>
    </div>
    <div class="right">
      <h1>GST Report</h1>
      <div class="muted">Period: {{PERIOD}}</div>
      <div class="muted">Filters: {{FILTERS}}</div>
      <div class="muted">Generated: {{GENERATED_AT}}</div>
    </div>
  </div>

  <div class="title">Invoice-wise detail</div>
  {{ROWS_TABLE}}
</div>
<div class="foot">&copy; {{YEAR}} <strong>{{HOTEL_NAME}}</strong>. Powered by MYOWNPMS.</div>
</body>
</html>
